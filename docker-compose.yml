services:
  db:
    image: postgres:16
    container_name: banana_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: banana
      POSTGRES_PASSWORD: banana_dev_password
      POSTGRES_DB: banana_trading
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: