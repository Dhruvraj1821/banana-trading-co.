services:
  db:
    image: postgres:16
    container_name: banana_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: banana
      POSTGRES_PASSWORD: banana_dev_password
      POSTGRES_DB: banana_trading
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: banana_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: